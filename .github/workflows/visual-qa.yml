name: Rendered visual QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:visual-tools
      - name: Review baseline provenance
        run: node scripts/visual-qa/baseline-review.mjs origin/main
      - name: Render and check all browser engines
        env:
          QA_BROWSERS: chromium,firefox,webkit
        run: pnpm check:visual
      - name: Record persistent scene performance
        if: ${{ !cancelled() && success() }}
        run: pnpm perf:visual
      - name: Preserve real evidence, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-visual-qa-${{ github.sha }}
          path: |
            design/validation-reports/.generated/report/
            design/validation-reports/.generated/performance/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
