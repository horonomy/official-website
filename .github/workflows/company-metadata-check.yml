name: Company Metadata Drift Check

# AAASM-5520: src/generated/company-metadata.ts is generated from the pinned
# Horonomy company registry projection (horonomy/.github metadata/company.json).
# The site footer contact + copyright consume that module. This gate fails
# closed if the generated module drifts from the pinned registry, so a stale
# contact literal can never merge.

on:
  pull_request:
    paths:
      - "src/generated/company-metadata.ts"
      - "scripts/generate-company-metadata.mjs"
      - "docusaurus.config.ts"
      - ".github/workflows/company-metadata-check.yml"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  company-drift:
    name: company metadata drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # This SHA carries the tags v7 and v7.0.0. The comment read `# v6.0.0`,
      # which was wrong by two majors and would have told a reader this job
      # runs a Node setup action it does not run (HORO-1503).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Audit generated company metadata against the pinned registry
        run: node scripts/generate-company-metadata.mjs --check
