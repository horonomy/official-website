name: Deploy Atlas

# Builds the Product Atlas (HORO-285) and deploys it to its own Cloudflare
# Pages project on every push to main (and on manual dispatch). Mirrors
# deploy.yml's structure exactly, on a separate project so the corporate
# site's own deploy is untouched by this workflow.
#
# Dormant by default: the job only runs once the repository variable
# ATLAS_DEPLOY_ENABLED is set to "true" — it never fails noisily before the
# domain (HORO-286) or credentials exist. Deleting this one file removes
# the entire deploy surface for the Atlas.
#
# Activate — Settings → Secrets and variables → Actions:
#   Variable  ATLAS_DEPLOY_ENABLED  = true
#   Secret    CLOUDFLARE_API_TOKEN  = API token with the
#             "Account → Cloudflare Pages → Edit" permission
#   Secret    CLOUDFLARE_ACCOUNT_ID = your Cloudflare account id
# (No manual Pages-project creation needed — the workflow provisions it.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-atlas-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: horonom-atlas

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: ${{ vars.ATLAS_DEPLOY_ENABLED == 'true' }}
    # wrangler reads these from the environment for both the create and deploy
    # steps; passed via env (never interpolated into a run: command).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # SHA-pinned (SonarCloud githubactions:S7637) — comment notes the tag
      # each SHA corresponds to.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts (SonarCloud githubactions:S6505): confirmed locally
      # that install/build still succeed under it — see ci.yml's atlas job
      # for the same note.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Atlas
        run: pnpm build:atlas

      # The publish gate, run against the Atlas's own output — the corporate
      # site's ci.yml/deploy.yml check theirs separately.
      - name: Check Atlas product claims
        run: node scripts/check-product-claims.mjs --build-dir atlas/dist

      # SonarCloud githubactions:S6505 flags this npx on-demand install
      # (arbitrary code execution risk from a mutable version range) — left
      # as-is to match deploy.yml's identical, already-established pattern
      # rather than diverging only here; pinning wrangler as a real
      # devDependency is a repo-wide change out of this ticket's scope.
      - name: Ensure the Cloudflare Pages project exists (idempotent)
        run: |
          npx --yes wrangler@3 pages project create "$PAGES_PROJECT" \
            --production-branch=main \
            || echo "Pages project already exists — continuing."

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy atlas/dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=main
            --commit-dirty=true
