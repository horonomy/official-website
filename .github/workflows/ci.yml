name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Runs after the build because it reads the published HTML, not the
      # source: that is what a reader and a crawler receive, and it is the only
      # form in which render-time text and minified markup exist. Offline by
      # design — it must not be able to fail because another service is down
      # (AAASM-5616). Exit 2 means the gate itself is broken, which is a
      # different event from a finding and is not swallowed here.
      - name: Check product claims
        run: pnpm check:claims
