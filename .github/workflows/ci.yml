name: CI

on:
  pull_request:
    branches: [main]
  # Also on main. `deploy.yml` publishes from main, so a gate that only runs on
  # pull requests cannot see the tree that actually ships: two individually
  # green PRs can merge into a red main, and the claim gate would never look at
  # the result it deploys (AAASM-5616).
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # Runs before the build, cheaply, on the source module — an invalid
      # product entry (bad maturity label, duplicate slug, missing URL)
      # should fail fast rather than surface only once check:claims reads
      # the rendered HTML (HORO-282).
      - name: Validate product registry
        run: pnpm check:registry

      - name: Build
        run: pnpm build

      # Runs after the build because it reads the published HTML, not the
      # source: that is what a reader and a crawler receive, and it is the only
      # form in which render-time text and minified markup exist. Offline by
      # design — it must not be able to fail because another service is down
      # (AAASM-5616). Exit 2 means the gate itself is broken, which is a
      # different event from a finding and is not swallowed here.
      - name: Check product claims
        run: pnpm check:claims

  atlas:
    name: atlas
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (SonarCloud githubactions:S7637) — this job is new code,
      # so unlike the `build` job above (pre-existing, tag-pinned, a
      # repo-wide convention out of this ticket's scope to change) it starts
      # pinned. Comment notes the tag each SHA corresponds to.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10

      # Separate Node version from the `build` job (which stays on 20): the
      # Atlas build script runs under Node's native TypeScript type
      # stripping (--experimental-strip-types), default-on from Node 22.18.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts (SonarCloud githubactions:S6505): confirmed locally
      # that install/typecheck/test/build all still succeed — this pnpm
      # setup already required explicit build-script approval by default
      # (pnpm 10's ERR_PNPM_IGNORED_BUILDS), so this makes existing
      # behavior explicit rather than changing it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check Atlas
        run: pnpm typecheck:atlas

      - name: Test Atlas
        run: pnpm test:atlas

      - name: Build Atlas
        run: pnpm build:atlas

      - name: Check Atlas product claims
        run: node scripts/check-product-claims.mjs --build-dir atlas/dist

      - name: Upload Atlas build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-dist
          path: atlas/dist
