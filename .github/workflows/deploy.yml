name: Deploy

# Builds the site and deploys it to Cloudflare Pages on every push to main
# (and on manual dispatch). The Pages project is created on first run if it
# does not exist, so the only manual setup is the three settings below.
#
# Dormant by default: the job only runs once the repository variable
# CLOUDFLARE_DEPLOY_ENABLED is set to "true", so it never fails noisily before
# credentials exist.
#
# Activate — Settings → Secrets and variables → Actions:
#   Variable  CLOUDFLARE_DEPLOY_ENABLED = true
#   Secret    CLOUDFLARE_API_TOKEN      = API token with the
#             "Account → Cloudflare Pages → Edit" permission
#   Secret    CLOUDFLARE_ACCOUNT_ID     = your Cloudflare account id
# (No manual Pages-project creation needed — the workflow provisions it.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: horonomy-official-website

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    # wrangler reads these from the environment for both the create and deploy
    # steps; passed via env (never interpolated into a run: command).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Ensure the Cloudflare Pages project exists (idempotent)
        run: |
          npx --yes wrangler@3 pages project create "$PAGES_PROJECT" \
            --production-branch=main \
            || echo "Pages project already exists — continuing."

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=main
            --commit-dirty=true
