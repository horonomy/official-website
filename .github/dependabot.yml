version: 2
updates:
  # JavaScript / TypeScript dependencies (pnpm — covered by the npm ecosystem).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    # react and react-dom must move in the same PR. Docusaurus aborts the build
    # unless their resolved versions are identical ("Incompatible React
    # versions"), so a PR that bumps only one of the pair can never go green —
    # that is a hard constraint, not a flake, and no relock resolves it.
    # Declared twice on purpose: a group only covers the update kind named by
    # `applies-to`, so without the second entry a React *security* advisory
    # would arrive ungrouped and deadlock in exactly the same way.
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # GitHub Actions used by the CI and deploy workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    # HORO-1645: github/codeql-action/init and /analyze are separate
    # dependencies to Dependabot, but analyze refuses a configuration file
    # written by a different version of init ("Loaded a configuration file for
    # version '4.38.2', but running version '4.38.1'"). Ungrouped, one upstream
    # release opens one pull request per step and neither can ever merge: every
    # language leg fails and the top-level CodeQL check degrades to neutral, so
    # the page shows a CodeQL entry that is not red while no analysis ran at
    # all.
    #
    # Both groups are required. applies-to defaults to version-updates, so a
    # single entry would leave the security-advisory path splitting exactly as
    # before -- which is the path that matters most.
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
