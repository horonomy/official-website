<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px;
    height: 630px;
    background: #0F1115;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .mark {
    width: 220px;
    height: 220px;
    margin-right: 56px;
  }
  .wordmark {
    color: #F4F5F7;
    font-size: 108px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Horonom">
      <g fill="none" stroke-width="8" stroke-linecap="round">
        <path d="M60.02 11.55 A40 40 0 0 1 87.09 64.98" stroke="#00B2FF"/>
        <path d="M87.09 64.98 A40 40 0 0 1 33.73 86.54" stroke="#E5E7EB"/>
        <path d="M26.49 82.36 A40 40 0 0 1 20.28 76.76" stroke="#00B2FF"/>
        <path d="M20.28 76.76 A40 40 0 0 1 38.98 11.55" stroke="#E5E7EB"/>
      </g>
      <g fill="#E5E7EB">
        <rect x="38.5" y="31" width="7" height="38"/>
        <rect x="54.5" y="31" width="7" height="38"/>
        <rect x="38.5" y="42" width="23" height="7"/>
      </g>
    </svg>
    <div class="wordmark">Horonom</div>
  </div>
</body>
</html>
